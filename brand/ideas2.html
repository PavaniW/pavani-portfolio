<!doctype html><html><head><meta charset="utf-8"><title>wordmark ideas</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#e9e4e6;font-family:"Instrument Sans",sans-serif}
.sheet{display:grid;gap:20px;padding:20px;width:1300px}
.card{height:300px;background:#fffafb;display:grid;place-items:center;position:relative;color:#4a0e2b}
.card img{width:760px}
.label{position:absolute;left:16px;bottom:12px;font-size:14px;font-weight:600;color:#7a3a58}
.row{display:grid;grid-template-columns:repeat(4,1fr)}
.row>div{height:160px;display:grid;place-items:center}
.row img{width:270px}
</style></head><body><div class="sheet">
<div class="card"><img src="wm-1-clean.svg"><span class="label">1 · Clean</span></div>
<div class="card"><img src="wm-2-kissing.svg"><span class="label">2 · Kissing letters (one continuous shape)</span></div>
<div class="card"><img src="wm-3-sliced.svg"><span class="label">3 · Sliced</span></div>
</div></body></html>
